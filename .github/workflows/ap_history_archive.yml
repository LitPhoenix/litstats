name: Monthly AP Archive Snapshot

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Snapshot Script
        run: node scripts/monthlyArchive.js

      - name: Commit and Push Archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ap_history_archive.yml
          git commit -m "chore: record monthly AP snapshot" || exit 0
          git push
