<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    p {
      color: #94a3b8;
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      background-color: #1e293b;
      color: #38bdf8;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Under Construction</div>
    <h1>Something new is coming soon</h1>
    <p>We're working hard to get things ready. Check back shortly for updates.</p>
  </div>
</body>
</html>
