<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>LitStats - Angel's Descent</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --accent-orange: #f95716;
    --accent-orange-hover: #e54e10;
    --panel-bg: #111111;
    --input-bg: #181818;
    --border-color: #262626;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background-color: #0a0a0a;
    color: #ffffff;
    margin: 0;
    padding: 0;
  }

  .page-container {
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }

  .page-title {
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }

  .search-container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 8px;
    gap: 8px;
  }

  .search-container input {
    width: 260px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-container input:focus {
    border-color: var(--accent-orange);
  }

  .btn-primary {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent-orange);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn-primary:hover {
    background: var(--accent-orange-hover);
  }

  .btn-icon {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--input-bg);
    color: #aaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s, border-color 0.2s;
  }

  .btn-icon:hover {
    color: #fff;
    border-color: #444;
  }

  #search-status {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    min-height: 18px;
    margin-bottom: 16px;
  }

  .status-green { color: #55FF55; }
  .status-red { color: #FF5555; }
  .status-gray { color: #888888; }

  /* Snug, Thinner Player Summary Card */
  .player-summary-panel {
    display: none;
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 14px 20px;
    margin: 0 auto 20px auto;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    align-items: center;
    gap: 18px;
    width: fit-content;
    max-width: 100%;
    box-sizing: border-box;
  }

  /* Bigger Avatar */
  .p-avatar-box {
    width: 84px;
    height: 84px;
    flex-shrink: 0;
  }

  .p-avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .p-details {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .p-name-line {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.35rem;
    font-weight: 700;
  }

  .p-level-badge {
    background: #1c1c1c;
    border: 1px solid #333;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
  }

  .p-pills-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* Bigger Font Pills */
  .p-pill {
    background: #181818;
    border: 1px solid #2a2a2a;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #ccc;
  }

  .descent-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
  }

  .stats-side-panel {
    display: none;
    width: 210px;
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    box-sizing: border-box;
  }

  .stats-title {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #222;
    padding-bottom: 6px;
  }

  .stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }

  .stat-label {
    color: #aaa;
  }

  .stat-val {
    font-weight: 700;
    font-size: 15px;
  }

  .gui-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .mc-scale-engine {
    transform-origin: top center !important;
    margin-top: 0 !important;
    padding-top: 0 !important;
  }

  .mc-container {
    margin-top: 0 !important;
  }

  .mc-title { margin-top: 0 !important; margin-bottom: 4px; }

  .mc-tooltip {
    will-change: transform;
    pointer-events: none !important;
    transform: translate3d(0, 0, 0);
  }
</style>
</head>

<script src="assets/js/components.js"></script>

<main class="page-container">
  <h1 class="page-title">Angel's Descent Calculator</h1>

  <div class="search-container">
    <input type="text" id="player-input" placeholder="Enter Username or UUID">
    <button id="search-btn" class="btn-primary">Load Unlocks</button>
    <button id="reset-btn" class="btn-icon" title="Reset Preview">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <div id="search-status" class="status-gray">Previewing all max unlocked items</div>

  <div class="player-summary-panel" id="player-summary-panel">
    <div class="p-avatar-box">
      <img id="player-avatar-img" src="" alt="Avatar">
    </div>
    <div class="p-details">
      <div class="p-name-line">
        <span class="p-level-badge" id="player-level-badge"></span>
        <span id="player-rank-html"></span>
        <span id="player-username-text"></span>
      </div>
      <div class="p-pills-row">
        <div class="p-pill">Opals: <span id="pill-opals">0</span></div>
        <div class="p-pill">Coins: <span style="color:#FFAA00" id="pill-coins">0</span></div>
        <div class="p-pill">Souls: <span style="color:#55FFFF" id="pill-souls">0</span></div>
        <div class="p-pill">Corruption: <span style="color:#AA00AA" id="pill-corruption">5%</span></div>
      </div>
    </div>
  </div>

  <div class="descent-layout">
    <div class="stats-side-panel" id="stats-side-panel">
      <div class="stats-title">SkyWars Summary</div>
      <div class="stat-item"><span class="stat-label">Wins</span><span class="stat-val" style="color:#55FF55" id="sw-wins">0</span></div>
      <div class="stat-item"><span class="stat-label">Kills</span><span class="stat-val" style="color:#55FF55" id="sw-kills">0</span></div>
      <div class="stat-item"><span class="stat-label">KDR</span><span class="stat-val" style="color:#FFAA00" id="sw-kdr">0</span></div>
      <div class="stat-item"><span class="stat-label">WLR</span><span class="stat-val" style="color:#FFAA00" id="sw-wlr">0</span></div>
      <div class="stat-item"><span class="stat-label">Heads</span><span class="stat-val" style="color:#AA00AA" id="sw-heads">0</span></div>
      <div class="stat-item"><span class="stat-label">Tokens</span><span class="stat-val" style="color:#00AA00" id="sw-tokens">0</span></div>
      <div class="stat-item"><span class="stat-label">Potions Brewed</span><span class="stat-val" style="color:#FF55FF" id="sw-potions">0</span></div>
      <div class="stat-item"><span class="stat-label">Playtime</span><span class="stat-val" style="color:#FFFF55" id="sw-playtime">0m</span></div>
    </div>

    <div class="gui-wrapper">
      <main class="mc-scale-engine">
        <div class="mc-container">
          <div class="mc-title" id="display-title">Angel's Descent</div>
          <div class="mc-grid" id="menu-grid"></div>
        </div>
      </main>
    </div>
  </div>
</main>

  function parseMinecraftColors(text) {
    if (!text || text.trim() === '') return '&nbsp;';
    const colorMap = { 
        '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA', 
        '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA', 
        '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF', 
        'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF' 
    };
    
    let html = '';
    let state = { color: '#AAAAAA', bold: false, italic: false, underline: false, strikethrough: false };

    function buildStyleString(s) {
        let styles = `color: ${s.color};`;
        if (s.bold) styles += ' font-weight: bold;';
        if (s.italic) styles += ' font-style: italic;';
        let decoration = [];
        if (s.underline) decoration.push('underline');
        if (s.strikethrough) decoration.push('line-through');
        if (decoration.length > 0) styles += ` text-decoration: ${decoration.join(' ')};`;
        return styles;
    }

    let parts = text.split(/(?=[&§][0-9a-flmno-r])/i);
    for (let part of parts) {
        if ((part.startsWith('&') || part.startsWith('§')) && part.length >= 2) {
            let code = part[1].toLowerCase();
            let textContent = part.substring(2);
            if (colorMap[code]) { 
                state.color = colorMap[code]; 
                state.bold = state.italic = state.underline = state.strikethrough = false;
            } 
            else if (code === 'l') { state.bold = true; } 
            else if (code === 'm') { state.strikethrough = true; }
            else if (code === 'n') { state.underline = true; }
            else if (code === 'o') { state.italic = true; }
            else if (code === 'r') { 
                state.color = '#AAAAAA'; 
                state.bold = state.italic = state.underline = state.strikethrough = false;
            }
            html += `<span style="${buildStyleString(state)}">${textContent}</span>`;
        } else {
            html += `<span style="${buildStyleString(state)}">${part}</span>`;
        }
    }
    return html;
  }

  function getPlusColourHex(colourName) {
    const colours = { 'RED': '#FF5555', 'GOLD': '#FFAA00', 'GREEN': '#55FF55', 'YELLOW': '#FFFF55', 'LIGHT_PURPLE': '#FF55FF', 'WHITE': '#FFFFFF', 'BLUE': '#5555FF', 'DARK_GREEN': '#00AA00', 'DARK_RED': '#AA0000', 'DARK_AQUA': '#00AAAA', 'DARK_PURPLE': '#AA00AA', 'DARK_GRAY': '#555555', 'BLACK': '#000000', 'DARK_BLUE': '#0000AA' };
    return colours[colourName] || '#FF5555';
  }

  function getRankBaseColourHex(rank, monthlyRankColor) {
    if (!rank || rank === 'NON') return '#AAAAAA';
    const clean = rank.replace(/\[|\]/g, ''); 
    if (clean.includes('++')) return monthlyRankColor === 'AQUA' ? '#55FFFF' : '#FFAA00';
    if (clean === 'MOJANG' || clean === 'EVENTS') return '#FFAA00'; 
    if (clean.includes('MVP')) return '#55FFFF'; 
    if (clean.includes('VIP')) return '#55FF55'; 
    if (clean.includes('YOUTUBE') || clean === 'STAFF') return '#FF5555'; 
    if (clean.includes('PIG')) return '#FF55FF'; 
    return '#AAAAAA';
  }

  function formatRankHtml(rank, plusColour, monthlyRankColor) {
    if (!rank || rank === 'NON') return '';
    const plusHex = getPlusColourHex(plusColour);
    const cleanRank = rank.replace(/\[|\]/g, ''); 
    const baseColor = getRankBaseColourHex(rank, monthlyRankColor);

    let formatted = cleanRank;
    if (cleanRank.includes('++')) formatted = `MVP<span style="color:${plusHex}">++</span>`;
    else if (cleanRank.includes('+')) formatted = `${cleanRank.split('+')[0]}<span style="color:${plusHex}">+</span>`;

    return `<span style="color:${baseColor}; font-weight:700;">[${formatted}]</span>`;
  }

  function formatPlaytime(seconds) {
    if (!seconds || seconds <= 0) return '0m';
    const m = Math.floor(seconds / 60);
    const d = Math.floor(m / 1440);
    const h = Math.floor((m % 1440) / 60);
    const mins = m % 60;
    let str = '';
    if (d > 0) str += `${d}d `;
    if (h > 0) str += `${h}h `;
    str += `${mins}m`;
    return str;
  }

  function renderGrid() {
    const grid = document.getElementById('menu-grid');
    grid.style.setProperty('--cols', menuConfig.cols);
    grid.style.setProperty('--rows', menuConfig.rows);
    
    let html = '';
    const totalSlots = menuConfig.cols * menuConfig.rows;
    
    for (let i = 0; i < totalSlots; i++) {
      const item = menuConfig.data[i];
      if (!item) {
        html += `<div class="slot"></div>`;
      } else {
        const texture = (!item.isLocked && item.texture) ? item.texture : MCEngine.getApiFallback(item);
        html += MCEngine.makeSlotHtml(item, texture);
      }
    }
    grid.innerHTML = html;
  }

  function resetToDefault() {
    menuConfig.data = JSON.parse(JSON.stringify(defaultItemsBackup));
    menuConfig.data.forEach(item => {
      if (item) {
        item.isLocked = false;
        if (item.baseLore) {
          if (item.rawName.includes("Opals")) {
            item.rawLore = item.baseLore.replace("{OPALS}", "∞");
          } else {
            const costText = item.cost ? `\n\n&7Cost: &9${item.cost}` : '';
            item.rawLore = item.baseLore + costText + "\n&aPurchased!";
          }
        }
      }
    });
    
    document.getElementById('player-summary-panel').style.display = 'none';
    document.getElementById('stats-side-panel').style.display = 'none';
    const statusEl = document.getElementById('search-status');
    statusEl.textContent = "Previewing all max unlocked items";
    statusEl.className = "status-gray";
    renderGrid();
  }

  async function fetchPlayerUnlocks(searchTerm) {
    if (!searchTerm) return;
    const statusEl = document.getElementById('search-status');
    statusEl.textContent = "Loading live stats from API...";
    statusEl.className = "status-gray";

    try {
      const param = searchTerm.length > 25 ? `uuid=${searchTerm}` : `name=${searchTerm}`;
      const response = await fetch(`/api/player?${param}`);
      
      const contentType = response.headers.get("content-type");
      if (!response.ok || (contentType && !contentType.includes("application/json"))) {
        throw new Error(`Server Error (${response.status}): Endpoint returned non-JSON response.`);
      }

      const data = await response.json();
      if (data.error) throw new Error(data.error);

      const swPackages = (data.angelsDescent?.packages || []).map(p => p.toLowerCase());
      const swStats = data.angelsDescent?.stats || {};
      const userOpals = data.angelsDescent?.opals !== undefined ? data.angelsDescent.opals : 0;
      const userCoins = data.angelsDescent?.coins || 0;
      const userSouls = data.angelsDescent?.souls || 0;
      const userLevelFormatted = data.angelsDescent?.levelFormatted || '';
      const userCorruption = data.angelsDescent?.corruptionChance || 5;

      document.getElementById('player-avatar-img').src = `https://visage.surgeplay.com/bust/${data.uuid}`;
      document.getElementById('player-avatar-img').onerror = function() {
        this.src = `https://vzge.me/bust/${data.uuid}.png`;
      };

      const rankHtml = formatRankHtml(data.rank, data.rankPlusColor, data.monthlyRankColor);
      document.getElementById('player-level-badge').innerHTML = parseMinecraftColors(userLevelFormatted);
      document.getElementById('player-rank-html').innerHTML = rankHtml;
      document.getElementById('player-username-text').textContent = data.username;
      document.getElementById('player-username-text').style.color = getRankBaseColourHex(data.rank, data.monthlyRankColor);

      document.getElementById('sw-wins').textContent = (data.angelsDescent?.wins || 0).toLocaleString();
      document.getElementById('sw-kills').textContent = (data.angelsDescent?.kills || 0).toLocaleString();
      document.getElementById('sw-kdr').textContent = data.angelsDescent?.kdr || "0.00";
      document.getElementById('sw-wlr').textContent = data.angelsDescent?.wlr || "0.00";
      document.getElementById('sw-heads').textContent = (data.angelsDescent?.heads || 0).toLocaleString();
      document.getElementById('sw-tokens').textContent = (data.angelsDescent?.tokens || 0).toLocaleString();
      document.getElementById('sw-potions').textContent = (data.angelsDescent?.potionsBrewed || 0).toLocaleString();
      document.getElementById('sw-playtime').textContent = formatPlaytime(data.angelsDescent?.timePlayed || 0);

      let totalOpalsSpent = 0;

      menuConfig.data.forEach(item => {
        if (!item) return;

        if (item.id === "custom_opal" && item.baseLore) {
          item.rawLore = item.baseLore.replace("{OPALS}", userOpals.toLocaleString());
          item.isLocked = false;
          return;
        }

        if (!item.apiKey) return;

        let currentTier = 0;
        let isFullyMaxed = false;
        const key = item.apiKey.toLowerCase();

        if (item.maxTier) {
          const rawVal = swStats[key] ?? swStats[`solo_${key}`] ?? swStats[`angels_descent_${key}`];
          if (typeof rawVal === 'number' && rawVal > 0) {
            currentTier = rawVal;
          } else {
            for (let t = item.maxTier; t >= 1; t--) {
              if (swPackages.includes(`${key}_${t}`) || swPackages.includes(`angels_descent_${key}_${t}`)) {
                currentTier = t;
                break;
              }
            }
          }
          isFullyMaxed = currentTier >= item.maxTier;
        } else {
          const rawVal = swStats[key] ?? swStats[`solo_${key}`] ?? swStats[`angels_descent_${key}`];
          
          const unlocked = (typeof rawVal === 'number' && rawVal > 0) || 
                           rawVal === true || 
                           swPackages.some(pkg => pkg === key || pkg === `angels_descent_${key}` || pkg.endsWith(`_${key}`));

          if (unlocked) {
            currentTier = 1;
            isFullyMaxed = true;
          }
        }

        if (isFullyMaxed && item.opalCost) {
          totalOpalsSpent += item.opalCost;
        } else if (currentTier > 0 && item.maxTier && item.opalCost) {
          totalOpalsSpent += Math.floor((item.opalCost / item.maxTier) * currentTier);
        }

        const titleBase = item.baseTitle || item.rawName.replace(/&[0-9a-f]/gi, '').replace(/§[0-9a-f]/gi, '');

        if (isFullyMaxed) {
          item.id = item.originalId || item.id;
          item.isLocked = false;
          item.rawName = `&a${titleBase}${item.maxTier ? ' ' + NUM_ROMAN[item.maxTier - 1] : ''}`;
          item.rawLore = item.baseLore + "\n\n&aPurchased!";
        } 
        else if (currentTier > 0) {
          item.id = item.originalId || item.id;
          item.isLocked = false;
          item.rawName = `&a${titleBase} ${NUM_ROMAN[currentTier - 1]}`;
          item.rawLore = item.baseLore + `\n\n&7Cost: &9${item.cost}\n&eCurrent Tier: ${currentTier}/${item.maxTier}`;
        } 
        else {
          if (!item.originalId) item.originalId = item.id;
          item.id = item.isCosmetic ? "coal_block" : "coal";
          item.isLocked = true;
          item.rawName = `&c${titleBase}${item.maxTier ? ' ' + NUM_ROMAN[item.maxTier - 1] : ''}`;
          item.rawLore = item.baseLore + `\n\n&7Cost: &9${item.cost}\n&cLocked!`;
        }
      });

      document.getElementById('pill-opals').innerHTML = `<span style="color:#5555FF">${userOpals.toLocaleString()}</span> <span style="color:#777">(${totalOpalsSpent.toLocaleString()} Spent)</span>`;
      document.getElementById('pill-coins').textContent = userCoins.toLocaleString();
      document.getElementById('pill-souls').textContent = userSouls.toLocaleString();
      document.getElementById('pill-corruption').textContent = `${userCorruption}%`;
      
      document.getElementById('player-summary-panel').style.display = 'flex';
      document.getElementById('stats-side-panel').style.display = 'flex';

      statusEl.textContent = `Showing Angel's Descent unlocks for ${data.username}`;
      statusEl.className = "status-green";
      renderGrid();

    } catch (e) {
      statusEl.textContent = e.message || "Failed to fetch player data.";
      statusEl.className = "status-red";
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('display-title').innerText = menuConfig.title;
    resetToDefault();

    document.getElementById('search-btn').addEventListener('click', () => {
      const val = document.getElementById('player-input').value.trim();
      fetchPlayerUnlocks(val);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('player-input').value = '';
      resetToDefault();
    });

    document.getElementById('player-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const val = document.getElementById('player-input').value.trim();
        fetchPlayerUnlocks(val);
      }
    });
  });

  document.addEventListener('tt-format', (e) => {
    const it = e.detail.item;
    let h = `<span class="tt-name" style="text-shadow: 2px 2px 0 rgba(0,0,0,0.8);">${parseMinecraftColors(it.rawName || '&f' + it.id)}</span>`;
    
    if (it.rawLore) {
        const lines = it.rawLore.split('\n');
        for (const l of lines) {
            h += `<span class="tt-line" style="text-shadow: 2px 2px 0 rgba(0,0,0,0.8); min-height: 16px;">${parseMinecraftColors(l)}</span>`;
        }
    }
    e.detail.html = h;
  });
